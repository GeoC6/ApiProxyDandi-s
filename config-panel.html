<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - API Autoservicio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-container {
            width: 95%;
            max-width: 1100px;
            height: 90vh;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            color: white;
            position: relative;
        }

        .app-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: white;
            border-radius: 40px 40px 0 0;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .app-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 400;
        }

        .app-body {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .alert-box {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            box-shadow: 0 4px 12px rgba(253, 203, 110, 0.2);
        }

        .alert-icon {
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .alert-content strong {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2d3436;
        }

        .alert-content p {
            color: #2d3436;
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #2196f3;
        }

        .info-card h3 {
            color: #1976d2;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.6;
        }

        .info-item::before {
            content: '→';
            color: #1976d2;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .info-item code {
            background: rgba(25, 118, 210, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: 600;
            color: #1565c0;
            margin-right: 4px;
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .editor-label {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
        }

        .char-counter {
            font-size: 13px;
            color: #718096;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            min-height: 200px;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
            resize: none;
            transition: all 0.2s;
            background: #f8f9fa;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .status-message {
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            align-items: center;
            gap: 12px;
        }

        .status-message.show {
            display: flex;
        }

        .status-message.success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .status-message.error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .app-footer {
            padding: 24px 40px;
            background: #f8f9fa;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(72, 187, 120, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            font-size: 16px;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5568d3 0%, #653890 100%);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-container {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="app-header">
            <div class="header-content">
                <h1 class="app-title">Configuración del Sistema</h1>
                <p class="app-subtitle">Gestiona las variables de entorno de la API Autoservicio</p>
            </div>
        </div>

        <div class="app-body">
            <div id="statusMessage" class="status-message"></div>

            <div class="info-grid" style="grid-template-columns: 1fr; gap: 1.5rem;">

                <div class="info-card">
                    <h3>Transbank IM30</h3>
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                        <label for="IM30_PORT" style="font-size:0.85rem; color:#555; font-weight:600;">Puerto COM del Pinpad</label>
                        <input id="IM30_PORT" type="text" placeholder="COM8" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:monospace;" />
                    </div>
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 6px; margin-top:12px;">
                        <label for="TBK_URL" style="font-size:0.85rem; color:#555; font-weight:600;">URL Servicio Transbank (gotbk)</label>
                        <input id="TBK_URL" type="text" placeholder="https://localhost:8001" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:monospace;" />
                    </div>
                </div>

                <div class="info-card">
                    <h3>XSign (Boleta Electrónica)</h3>
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                        <label for="XSIGN_URL" style="font-size:0.85rem; color:#555; font-weight:600;">URL Servicio XSign</label>
                        <input id="XSIGN_URL" type="text" placeholder="http://localhost:5999" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:monospace;" />
                    </div>
                </div>

                <div class="info-card">
                    <h3>Servidor Odoo</h3>
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                        <label for="ODOO_URL" style="font-size:0.85rem; color:#555; font-weight:600;">URL Odoo</label>
                        <input id="ODOO_URL" type="text" placeholder="https://dandis.posgo.cl" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:monospace;" />
                    </div>
                </div>

                <div class="info-card">
                    <h3>KDS (Kitchen Display System)</h3>
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                        <label for="KDS_URL" style="font-size:0.85rem; color:#555; font-weight:600;">URL Servicio KDS</label>
                        <input id="KDS_URL" type="text" placeholder="http://localhost:9001" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:monospace;" />
                    </div>
                </div>

                <div class="info-card">
                    <h3>Impresora</h3>
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                        <label for="PRINTER_TICKET_NAME" style="font-size:0.85rem; color:#555; font-weight:600;">Nombre de la Impresora de Tickets</label>
                        <input id="PRINTER_TICKET_NAME" type="text" placeholder="Nombre en Windows" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:1rem;" />
                    </div>
                    <div class="info-item" style="flex-direction: column; align-items: flex-start; gap: 6px; margin-top:12px;">
                        <label for="PRINTER_ENABLED" style="font-size:0.85rem; color:#555; font-weight:600;">Impresión habilitada</label>
                        <select id="PRINTER_ENABLED" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:1rem;">
                            <option value="true">Sí</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>

            </div>
        </div>

        <div class="app-footer">
            <button class="btn btn-success" onclick="loadConfig()">
                <span class="btn-icon">↻</span>
                Recargar
            </button>
            <button class="btn btn-secondary" onclick="window.close()">
                <span class="btn-icon">×</span>
                Cancelar
            </button>
            <button class="btn btn-primary" onclick="saveConfig()">
                <span class="btn-icon">✓</span>
                Guardar Cambios
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:9000';
        const fields = ['IM30_PORT', 'TBK_URL', 'XSIGN_URL', 'ODOO_URL', 'KDS_URL', 'PRINTER_TICKET_NAME', 'PRINTER_ENABLED'];

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type} show`;
            setTimeout(() => statusEl.classList.remove('show'), 4000);
        }

        async function loadConfig() {
            try {
                const res = await fetch(`${API_URL}/api/config`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                fields.forEach(key => {
                    const el = document.getElementById(key);
                    if (el && data.config[key] !== undefined) el.value = data.config[key];
                });
                showStatus('Configuración cargada correctamente', 'success');
            } catch (error) {
                showStatus('Error cargando configuración: ' + error.message, 'error');
            }
        }

        async function saveConfig() {
            try {
                const body = {};
                fields.forEach(key => {
                    const el = document.getElementById(key);
                    if (el) body[key] = el.value.trim();
                });
                const res = await fetch(`${API_URL}/api/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                showStatus('Configuración guardada. Los cambios aplican en la próxima transacción.', 'success');
            } catch (error) {
                showStatus('Error guardando configuración: ' + error.message, 'error');
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveConfig(); }
        });

        loadConfig();
    </script>
</body>

</html>
